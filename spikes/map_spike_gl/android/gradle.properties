org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
#
# 【2026-08-13 変更】既定の false から true にした。maplibre_gl 0.27.0
# (release-0.27.0) を AGP 9 で使うために必須。
#   - 0.27.0 の maplibre_gl/android/build.gradle は AGP major >= 9 のとき
#     `apply plugin: 'kotlin-android'` を実行しない（Flutter の built-in Kotlin 移行に追随）
#   - 一方 build.gradle は `kotlin { compilerOptions { ... } }` を呼ぶため、
#     AGP 側が kotlin 拡張を提供しないと次で落ちる:
#       Could not find method kotlin() ... on project ':maplibre_gl'
#   - builtInKotlin=false だと AGP が拡張を提供しないため、true が必要
# 0.26.2（安定版）は KGP を無条件で適用するため false のままでもビルドできる。
# 安定版へ戻す場合はこの値も false に戻してよい。
android.builtInKotlin=true
