name: terra_town_location
description: >-
  terra-town の GPS・地図・測位レイヤー。
  terra_town_core が定義する抽象（PositionProvider・RegionPack 等）を実装する。
version: 0.1.0
publish_to: none

# 【重要】GPS_ARCHITECTURE 準拠（plan.md §1-D・§2）
#   依存方向は location -> core の一方向のみ。
#   core 側から本パッケージを参照してはならない。
#   地図SDK（MapLibre）や位置取得プラグインへの依存は、必ず本パッケージ側に置く。

environment:
  sdk: ^3.12.2
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  terra_town_core:
    path: ../core
  # fog of war は feature-state 方式（plan.md §8）。Android の setFeatureState は
  # 0.27.0 で対応（0.26.2 は UnimplementedError）。
  #
  # 【一時的差し戻し・2026-09-10・Issue #67 / 案A】
  # Issue #55（2026-09-07 代表決定）では「pub.dev 版 maplibre_gl: ^0.27.0 を採用し、
  # git 依存（ref 固定）は採らない」と決めていた。しかし 0.27.0 は
  # android.builtInKotlin=true（Issue #67 の暫定対応）を要求し、これは
  # kotlin-android を適用する他の Flutter プラグイン（path_provider 等）を
  # 一切使えなくする相互排他を生む。上流 maplibre/flutter-maplibre-gl の
  # 修正 PR #1020（"fix(android): apply KGP when AGP does not compile Kotlin
  # itself"）が 2026-09-08 に main へマージ済みだが、pub.dev は 0.27.0
  # （2026-08-19）のまま未リリースのため、その修正を取り込むには git 依存が
  # 必要。2026-09-10 代表決定によりこの git 依存（案A）を一時的に採用する。
  # ref は上流 main の該当コミットに固定（workspace 構成のため path 指定必須）。
  # 【撤去条件】0.27.1 以降が pub.dev にリリースされ次第、本エントリを
  # `maplibre_gl: ^0.27.1`（またはそれ以降）に戻し、Issue #55 の決定に復帰する。
  # 追跡 Issue は秘書セッションが別途起票する。
  maplibre_gl:
    git:
      url: https://github.com/maplibre/flutter-maplibre-gl.git
      ref: 2dff788c650f0d49677397aae55423774aecb8f2
      path: maplibre_gl

  # 永続化（Issue #83・tasks.md T030〜T034）。plan.md §6「ストレージ: SQLite（Drift 等）。
  # ゲーム状態・地域パック（読み取り専用）を分離」に対応する。
  # core への SQLite/Drift 依存の持ち込みは禁止（GPS_ARCHITECTURE・tools/check_import_direction.sh）
  # なので、DB 層は本パッケージ（location）側に置く。
  drift: ^2.34.4
  # ネイティブ sqlite3 バイナリの同梱。本パッケージ（Flutter プラグイン形式）に依存を置くだけで
  # app 側の pubspec.yaml を編集せずに Android への同梱が完結する
  # （Flutter のプラグイン機構により app の依存グラフへ推移的に伝播するため）。
  sqlite3_flutter_libs: ^0.6.0+eol
  # RegionPackConnection が読み取り専用オープン（OpenMode.readOnly）に直接使う。
  # drift 経由の推移的依存にせず、直接使用するパッケージとして明示する。
  sqlite3: ^3.5.2
  path: ^1.9.1
  # ゲーム状態DB・地域パックDB それぞれのファイルパス解決に使用する。
  path_provider: ^2.1.6

  # 緯度経度→ヘクスID変換（Issue #101 `HexLocator` 抽象の実装・Issue #115）。
  #
  # 【暫定実装であることの明記・Issue #107（2026-09-10 代表決定）】
  # 当面は Dart 側（本パッケージ）で h3_flutter を使って実装する。
  # 位置記録基盤（tasks.md T046〜T049・Issue #10）に着手する時点で、
  # 同じ変換ロジックを Kotlin 側（案B）へ寄せる予定（追跡: Issue #108・`future`）。
  # それまでの先行実装であり、恒久的な実装場所の決定ではない。
  #
  # `h3_dart` ではなく `h3_flutter` を使う理由: `h3_dart` は `h3_ffi` に直接依存する
  # 素の Dart パッケージで Flutter プラグインの形（Android/iOS へのネイティブライブラリ
  # 同梱・アセット登録）を取らないため、Flutter アプリからそのまま使うには
  # `h3_flutter`（`h3_ffi`/`h3_web`/`h3_common` を Flutter プラグインとして束ねたもの）
  # を使うのが正しい（Issue #115 本文で明示）。
  #
  # バージョン: `docs/terrain.md` §4.2 の代表決定（2026-09-08・Issue #38）により、
  # H3 v4 世代の API（`geoToCell`/`cellToGeo` 等）を使うこと。`h3_flutter` 0.7.x
  # （`h3_common`/`h3_ffi` 0.7.x）がこの世代の API を提供することを確認済み
  # （`h3_common` の `H3.geoToCell(GeoCoord, int) -> H3Index`。`H3Index` は `BigInt`）。
  h3_flutter: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Drift のコード生成（*.g.dart）。CI（.github/workflows/ci.yml）は build_runner を
  # 実行しないため、生成物はコミットする方針とする（詳細は PR 本文参照）。
  drift_dev: ^2.34.6
  build_runner: ^2.15.1

flutter:
