org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
# ⚠️ 暫定対応（2026-09-08、Issue #55 / PR #66）: true に変更している。
#   理由: maplibre_gl 0.27.0 の android/build.gradle は AGP メジャーバージョンが 9 未満の
#   ときだけ Kotlin Gradle Plugin (kotlin-android) を適用し、AGP 9 以降は
#   「AGP 自身が Kotlin を提供する」ことを前提にしている。しかし本プロジェクトは
#   Flutter 3.44.8 の既定どおり android.builtInKotlin=false（AGPにKotlin提供させない）
#   のまま AGP 9.0.1 を使っているため、:maplibre_gl に KGP 適用も
#   AGP 提供の Kotlin もどちらも無くなり、build.gradle 内の kotlin {} 拡張の評価が
#   `Could not find method kotlin()` で失敗する。
#   Flutter 既定値は false（本設定はその既定からの逸脱）。true にすると Flutter が
#   「KGPを適用するプラグインは将来のFlutterで失敗しうる」という非推奨警告を出す。
#   撤去条件・追跡: Issue #67。上流 maplibre_gl が Built-in Kotlin（AGP 9+ noKGP）に
#   対応し次第、この行を false に戻し本コメントを削除する。
#   注意: この変更だけでは flutter build apk は通らない。maplibre_gl 0.27.0 は
#   別途 JDK 21 を要求する（本プロジェクトの正本JDKは17）。詳細は docs/dev-setup.md
#   の「maplibre_gl 0.27.0 は JDK 21 を要求する」節・research.md §6.1 を参照。
android.builtInKotlin=true
