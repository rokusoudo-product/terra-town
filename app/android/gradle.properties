org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
# 【Issue #67・2026-09-10 対応済み】Flutter 既定の false に復帰した。
#   経緯: maplibre_gl 0.27.0（pub.dev版）は AGP 9 + builtInKotlin=false だと
#   `Could not find method kotlin()` で失敗するため、暫定対応として true に
#   していた（PR #66）。しかしこの true は kotlin-android を適用する他の
#   Flutter プラグイン（path_provider 等）を軒並み使えなくする相互排他を生む
#   ブロッカーだった（実測 2026-09-10）。
#   上流 maplibre/flutter-maplibre-gl の修正 PR #1020 が 2026-09-08 に
#   main へマージ済み（commit 2dff788c650f0d49677397aae55423774aecb8f2）で、
#   packages/location/pubspec.yaml をこの commit への git 依存に切り替えた
#   ことでこの行を false に戻せるようになった（pub.dev は 0.27.0 のまま
#   未リリースのため git 依存。詳細は pubspec.yaml のコメントと Issue #67）。
android.builtInKotlin=false
# Issue #142（T059）: permission_handler_android(14.1.0) が compileSdk 37 を要求する
# ため app/build.gradle.kts で compileSdk を明示的に 37 へ上書きした。AGP 9.0.1 は
# 「compileSdk 37 は AGP 9.0.1 が検証済みの範囲（〜36.1）を超える」という警告を出す
# （実害はなく、単に新しいSDKに対するAGPの検証済み範囲の警告）。この警告を抑制する。
android.suppressUnsupportedCompileSdk=37.0
