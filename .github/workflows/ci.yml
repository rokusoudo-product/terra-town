name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    name: analyze / test / import-direction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # JDK: この値が正本（enforced value）。docs/dev-setup.md §2 は実測値の記録であり、
      # 乖離時は docs/dev-setup.md 側をこの値に合わせて更新する。
      # Flutter バージョンを上げるときは docs/dev-setup.md §2 も同じ PR で更新する。
      # ci.yml と docs/dev-setup.md §2 の乖離は tools/check_toolchain_versions.sh が機械的に検出する（Issue #59）。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # flutter-version: この値が正本（enforced value）。docs/dev-setup.md §2 の実測値と
      # 一致させる（固定）。乖離時は docs/dev-setup.md 側をこの値に合わせて更新する。
      # ci.yml と docs/dev-setup.md §2 の乖離は tools/check_toolchain_versions.sh が機械的に検出する（Issue #59）。
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.8"

      - name: Flutter version
        run: flutter --version

      # 依存方向チェック自身の検出ロジックが壊れていないかを検証する自己テスト（Issue #50）。
      # 過去にシングルクォートのみを要求する正規表現の穴があり、CI は常に green のまま
      # ガードが機能しなくなっていたことがある。チェック本体より前に実行する。
      - name: Self-test import-direction guard
        run: bash tools/check_import_direction_test.sh

      # GPS_ARCHITECTURE: core は location/Flutter/地図SDK に依存しない。
      # 規約ではなく仕組みで守る（plan.md §1-D・§2）。
      # pub get より前に実行して、違反を最短で検出する。
      - name: Check dependency direction (core does not depend on location)
        run: bash tools/check_import_direction.sh

      # デザイントークンガード自身の検出ロジックが壊れていないかを検証する自己テスト（Issue #58）。
      # check_design_tokens.sh は現在の main ではNGケースを一度も踏まないため、
      # 自己テストが無いと PATTERN を丸ごと壊しても CI は常に green のままだった
      # （Issue #50 と同じ「静かに壊れるガード」の構造）。チェック本体より前に実行する。
      - name: Self-test design-token guard
        run: bash tools/check_design_tokens_test.sh

      # DESIGN.md: カラーコードの直書き禁止・トークン経由（CLAUDE.md / color_tokens.dart）。
      # 規約ではなく仕組みで守る（Issue #47）。pub get より前に実行して最短で検出する。
      - name: Check design token usage (no raw color literals outside design/)
        run: bash tools/check_design_tokens.sh

      # ツールチェーンバージョンガード自身の検出ロジックが壊れていないかを検証する自己テスト（Issue #59）。
      # 抽出用の正規表現や docs/dev-setup.md §2 セクションの切り出しロジックが壊れても
      # CI が常に green のままガードが機能しなくなる、という Issue #50 / #58 と同じ
      # 「静かに壊れるガード」の構造を防ぐ。チェック本体より前に実行する。
      - name: Self-test toolchain-version guard
        run: bash tools/check_toolchain_versions_test.sh

      # Flutter/JDK のバージョンが ci.yml（正本）と docs/dev-setup.md §2 の間で
      # 乖離していないかを検査する。規約ではなく仕組みで守る（Issue #59）。
      # pub get より前に実行して、乖離を最短で検出する。
      - name: Check toolchain version consistency (ci.yml vs docs/dev-setup.md §2)
        run: bash tools/check_toolchain_versions.sh

      - name: Resolve dependencies
        run: |
          flutter pub get -C packages/core
          flutter pub get -C packages/location
          flutter pub get -C app

      - name: Analyze
        run: |
          flutter analyze packages/core
          flutter analyze packages/location
          flutter analyze app

      # core は純粋 Dart パッケージなので dart test だけで回る
      # （Flutter/GPS なしで単体テストできることが分離の狙い）
      - name: Test core (pure Dart)
        run: dart test
        working-directory: packages/core

      - name: Test location
        run: flutter test
        working-directory: packages/location

      - name: Test app
        run: flutter test
        working-directory: app

      # tasks.md T005 の完了条件、docs/dev-setup.md §7 の常用コマンド。
      # flutter analyze / test は Dart 側しか見ないため、Gradle 設定・
      # AndroidManifest.xml・res/ リソースの破損はここで初めて検出できる。
      - name: Build Android debug APK
        run: flutter build apk --debug
        working-directory: app
